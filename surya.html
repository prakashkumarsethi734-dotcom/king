<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya Namaskar AI Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Pose Requirements -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #FFFBF5; color: #433422; }
        .video-viewport {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: #111;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            margin: 0 auto;
        }
        /* Single display element */
        #output_canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Hidden input video */
        #input_video {
            display: none;
        }
        .pose-card.active {
            border-color: #0b7cf5;
            background-color: #149954;
            transform: scale(1.05);
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #F59E0B;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-amber-800">Surya Namaskar AI</h1>
                <p class="text-amber-700/70">Unified Real-time Pose View</p>
            </div>
            <div class="flex gap-3">
                <button id="startBtn" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-full font-bold transition flex items-center gap-2">
                    <span id="btnText">Start Single Feed AI</span>
                </button>
                <button id="resetBtn" class="bg-stone-200 hover:bg-stone-300 text-stone-700 px-6 py-2 rounded-full font-bold transition">Reset</button>
            </div>
        </header>

        <!-- Step Indicator -->
        <div class="grid grid-cols-6 md:grid-cols-12 gap-2 mb-8" id="stepIndicator"></div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-3">
                <!-- Unified Viewport -->
                <div class="video-viewport">
                    <video id="input_video"></video>
                    <canvas id="output_canvas"></canvas>
                    
                    <!-- Loading Overlay -->
                    <div id="loader" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/80 text-white hidden">
                        <div class="loading-spinner mb-4"></div>
                        <p class="font-medium">Initializing Unified Camera Feed...</p>
                    </div>

                    <!-- Single HUD Overlays -->
                    <div class="absolute top-4 left-4 z-20 bg-black/60 backdrop-blur-md p-4 rounded-xl border border-white/10 text-white pointer-events-none">
                        <div class="text-[10px] uppercase tracking-widest opacity-60">Status</div>
                        <div id="statusHUD" class="text-lg font-bold text-amber-400">READY</div>
                        <div class="mt-2 text-[10px] uppercase tracking-widest opacity-60">Current Step</div>
                        <div id="poseTitle" class="text-sm font-semibold">Step 1: Pranamasana</div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-amber-100">
                    <h3 class="font-bold text-lg mb-4 text-amber-900">Pose Instructions</h3>
                    <div id="instructions" class="text-sm text-stone-600 leading-relaxed mb-4">
                        Stand tall with hands in prayer position. Feet together.
                    </div>
                    <div id="feedback" class="p-3 bg-red-50 text-red-700 rounded-lg text-xs font-bold hidden">
                        Correction needed...
                    </div>
                </div>

                <div class="bg-amber-900 text-amber-50 p-6 rounded-2xl shadow-inner">
                    <h3 class="font-bold text-lg mb-2">Posture Score</h3>
                    <div class="flex justify-between items-end">
                        <span id="metricName" class="text-sm opacity-80">Angle</span>
                        <span id="metricVal" class="text-2xl font-mono font-bold">0°</span>
                    </div>
                    <div class="w-full bg-amber-800 h-2 rounded-full mt-2 overflow-hidden">
                        <div id="metricBar" class="bg-amber-400 h-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loader = document.getElementById('loader');
        
        const poses = [
            { name: "Pranamasana", angleRef: [11, 13, 15], target: 180, thresh: 20 },
            { name: "Hastauttanasana", angleRef: [11, 23, 25], target: 160, thresh: 30 },
            { name: "Uttanasana", angleRef: [23, 25, 27], target: 45, thresh: 25 },
            { name: "Ashwa Sanchal", angleRef: [24, 26, 28], target: 90, thresh: 20 },
            { name: "Dandasana", angleRef: [11, 23, 25], target: 180, thresh: 15 },
            { name: "Ashtanga Namaskar", angleRef: [23, 25, 27], target: 120, thresh: 40 },
            { name: "Bhujangasana", angleRef: [11, 23, 25], target: 140, thresh: 20 },
            { name: "Adho Mukha", angleRef: [23, 25, 27], target: 70, thresh: 25 },
            { name: "Ashwa Sanchal", angleRef: [23, 25, 27], target: 90, thresh: 20 },
            { name: "Uttanasana", angleRef: [23, 25, 27], target: 45, thresh: 25 },
            { name: "Hastauttanasana", angleRef: [11, 23, 25], target: 160, thresh: 30 },
            { name: "Tadasana", angleRef: [11, 23, 25], target: 180, thresh: 15 }
        ];

        let currentStep = 0;
        let camera = null;

        // Create Step Cards
        const stepContainer = document.getElementById('stepIndicator');
        poses.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = `pose-card border-2 border-stone-200 p-2 rounded-lg text-center transition-all bg-white cursor-pointer hover:bg-amber-50`;
            div.innerHTML = `<span class="block text-[10px] font-bold text-stone-400">${i+1}</span>`;
            div.id = `step-${i}`;
            div.onclick = () => { currentStep = i; updateUI(); };
            stepContainer.appendChild(div);
        });

        function findAngle(p1, p2, p3) {
            const radians = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        function onResults(results) {
            // Set canvas size once to match video stream
            if (canvasElement.width !== results.image.width) {
                canvasElement.width = results.image.width;
                canvasElement.height = results.image.height;
            }

            canvasCtx.save();
            // Clear and draw video frame as the single background
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                // Draw skeleton on top of the video in the same canvas
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {
                    color: '#FFFFFF', 
                    lineWidth: 4
                });
                drawLandmarks(canvasCtx, results.poseLandmarks, {
                    color: '#F59E0B', 
                    lineWidth: 2, 
                    radius: 4
                });

                // Analysis Logic
                const landmarks = results.poseLandmarks;
                const currentPose = poses[currentStep];
                const p1 = landmarks[currentPose.angleRef[0]];
                const p2 = landmarks[currentPose.angleRef[1]];
                const p3 = landmarks[currentPose.angleRef[2]];

                if (p1 && p2 && p3) {
                    const angle = findAngle(p1, p2, p3);
                    const diff = Math.abs(angle - currentPose.target);
                    
                    document.getElementById('metricVal').innerText = Math.round(angle) + "°";
                    document.getElementById('metricBar').style.width = Math.min(100, (angle/180 * 100)) + "%";

                    if (diff < currentPose.thresh) {
                        document.getElementById('statusHUD').innerText = "POSETURE CORRECT";
                        document.getElementById('statusHUD').style.color = "#10B981";
                    } else {
                        document.getElementById('statusHUD').innerText = "ADJUSTING...";
                        document.getElementById('statusHUD').style.color = "#F59E0B";
                    }
                }
            }

            canvasCtx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        document.getElementById('startBtn').addEventListener('click', async () => {
            loader.classList.remove('hidden');
            document.getElementById('btnText').innerText = "Camera Active";
            
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({image: videoElement});
                },
                width: 1280,
                height: 720
            });
            
            camera.start().then(() => {
                loader.classList.add('hidden');
                document.getElementById('startBtn').style.display = 'none';
                updateUI();
            });
        });

        function updateUI() {
            document.querySelectorAll('.pose-card').forEach((c, i) => {
                c.classList.toggle('active', i === currentStep);
            });
            document.getElementById('poseTitle').innerText = `Step ${currentStep + 1}: ${poses[currentStep].name}`;
            document.getElementById('instructions').innerText = getPoseInstructions(poses[currentStep].name);
        }

        function getPoseInstructions(name) {
            const guides = {
                "Pranamasana": "Stand straight, hands in prayer at chest.",
                "Hastauttanasana": "Arch back slightly, arms raised.",
                "Uttanasana": "Fold forward, try to touch your toes.",
                "Ashwa Sanchal": "One knee back, look forward.",
                "Dandasana": "Keep your body in a straight plank.",
                "Ashtanga Namaskar": "Knees, chest, and chin to floor.",
                "Bhujangasana": "Lift chest, look up like a cobra.",
                "Adho Mukha": "Inverted V shape, heels down.",
                "Tadasana": "Stand firm and balanced."
            };
            return guides[name] || guides["Pranamasana"];
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            currentStep = 0;
            updateUI();
        });
    </script>
</body>
</html>
